name: Проверка проекта

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Проверка синтаксиса скриптов
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Проверка API
        run: ./check_api.sh https://httpbin.org/status/200
